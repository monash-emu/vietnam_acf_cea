[project]
name = "vacf"
version = "0.1.0"
description = "Vietnam active case-finding cost-effectiveness analysis"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "David Shipman" },
    { name = "James Trauer" },
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacf"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: NUTS recovery; not part of pixi run test",
]
