[workspace]
name = "tb-macro-summer4"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
pandas = ">=2.2"
pyarrow = "*"
jupyterlab = "*"
pytest = "*"
black = "*"

[pypi-dependencies]
summer4 = { git = "https://github.com/monash-emu/summer4.git", tag = "v0.2.0a1", extras = ["jax", "calibration", "pandas", "frames"] }
arviz = "*"
plotly = ">=6.6, <7"
ipywidgets = "*"
nbformat = "*"
tb_macro = { path = ".", editable = true }

[tasks]
test = "pytest -q -m 'not slow'"
test-slow = "pytest -q -m slow"
format = "black src tests reference/make_golden.py"
format-check = "black --check src tests reference/make_golden.py"
notebook = "jupyter lab notebooks"

[feature.reference]
platforms = ["osx-arm64", "linux-64"]
dependencies = { python = "3.13.*", pandas = "*", pyarrow = "*" }
pypi-dependencies = { summer3 = { git = "https://github.com/monash-emu/summer3wip.git", rev = "22d3aa691319eedad2da77e819f8f06daf07c06a" }, jax = ">=0.9", jaxlib = ">=0.9", diffrax = ">=0.7.2, <0.8", numpyro = ">=0.20, <0.21" }
tasks = { golden = "python reference/make_golden.py" }

[environments]
default = { solve-group = "default" }
reference = { features = ["reference"], no-default-feature = true }
