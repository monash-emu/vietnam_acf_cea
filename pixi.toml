[workspace]
name = "tb-macro-summer4"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
pandas = ">=2.2"
pyarrow = "*"
jupyterlab = "*"
ipykernel = "*"
pytest = "*"
black = "*"

[pypi-dependencies]
# JAX 0.8+ implements pmap as jit(shard_map), which crashes Diffrax's default
# RecursiveCheckpointAdjoint. 0.7.2 is the newest release where parallel NUTS
# chains work without a flag, and the fastest of the releases that do.
jax = "==0.7.2"
jaxlib = "==0.7.2"
# summer4 main at c9548d5 (after v0.2.0a5): Diffrax solver backends (step 29) let
# run() take a PIDController with dtmax; BayesianModel / wf.* landed in a5.
summer4 = { git = "https://github.com/monash-emu/summer4.git", rev = "c9548d57dc15e12e5017c117918bb7f1bd0165eb", extras = ["calibration", "pandas", "frames"] }
arviz = "*"
h5netcdf = "*"
h5py = "*"
optax = "*"
plotly = ">=6.6, <7"
ipywidgets = "*"
nbformat = "*"
tb_macro = { path = ".", editable = true }

[tasks]
test = "pytest -q -m 'not slow'"
test-slow = "pytest -q -m slow"
format = "black src tests reference/make_golden.py reference/make_calibration_golden.py reference/calibration_golden.py scripts/massive/calibrate.py"
format-check = "black --check src tests reference/make_golden.py reference/make_calibration_golden.py reference/calibration_golden.py scripts/massive/calibrate.py"
notebook = "jupyter lab notebooks"
install-kernel = "python -m ipykernel install --sys-prefix --name tb-macro-summer4 --display-name 'tb-macro-summer4 (pixi)'"

[feature.reference]
platforms = ["osx-arm64", "linux-64"]
dependencies = { python = "3.13.*", pandas = "*", pyarrow = "*" }
pypi-dependencies = { summer3 = { git = "https://github.com/monash-emu/summer3wip.git", rev = "15ad51b44f3c4de687aa33e8e9c6213d3e228e30" }, jax = "==0.9.1", jaxlib = "==0.9.1", diffrax = ">=0.7.2, <0.8", numpyro = ">=0.20, <0.21", arviz = "==0.23.4" }
tasks = { golden = "python reference/make_golden.py && python reference/make_calibration_golden.py", golden-calibration = "python reference/make_calibration_golden.py" }

[environments]
default = { solve-group = "default" }
reference = { features = ["reference"], no-default-feature = true }
